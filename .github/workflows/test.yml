name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install shells
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -yq zsh fish
          else
            brew install fish
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Lint install script
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - run: go test -race ./...
      - name: Build static binary
        run: CGO_ENABLED=0 go build -o whyexit . && ./whyexit 137
